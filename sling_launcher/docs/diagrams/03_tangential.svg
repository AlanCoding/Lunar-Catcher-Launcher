<text x="795" y="440" class="small" text-anchor="start">Rolling resistance opposes travel.</text>
<text x="795" y="465" class="small" text-anchor="start">Reactions are solved, not prescribed.</text>
<text x="795" y="490" class="small" text-anchor="start">No negative wheel normal force.</text>
<text x="35" y="661" class="small" text-anchor="start">Sling lag during acceleration creates tangential apex force. Leg forces can include axial load, shear and bending.</text>
<text x="35" y="685" class="small" text-anchor="start">Blue: hardware / geometry    Red: applied forces    Green dashed: motion / acceleration    Not to scale</text></svg>
